<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>void-slice — lint Dishonored 2 / DOTO files</title>
    <meta name="description" content="A linter for Dishonored 2 and Death of the Outsider game files. Paste or drop a .decl, .entities, or .entitydef file to find structural problems." />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("vs-theme");
          var theme = stored || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

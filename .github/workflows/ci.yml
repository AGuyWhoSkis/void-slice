name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  GO_VERSION: "1.23"
  NODE_VERSION: "20"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go vet ./...
      - run: go test ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: golangci/golangci-lint-action@v6
        with:
          # Keep this pinned version aligned with .devcontainer/devcontainer.json's
          # GOLANGCI_LINT_VERSION arg so local `make lint` and CI run the same binary.
          version: v1.64.8
          args: --timeout=5m

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build CLI
        run: go build -o /tmp/voidslice ./cmd/voidslice

      - name: Build Worker WASM
        run: ./worker/build.sh

      - name: Verify bundle fits Free-tier compressed limit (3 MB)
        run: |
          gz=$(gzip -9 -c worker/voidslice.wasm | wc -c)
          echo "voidslice.wasm gz=$gz bytes"
          test "$gz" -lt 3145728 || (echo "Worker bundle exceeds 3 MB compressed" && exit 1)

      - name: Build frontend
        working-directory: web
        run: |
          npm ci || npm install
          npm run build
        env:
          # Falls back to localhost when the var isn't set (e.g. main pushes
          # before vars.VITE_API_URL is configured). Production / preview
          # deploys rebuild the frontend with the right URL.
          VITE_API_URL: ${{ vars.VITE_API_URL || 'http://localhost:8080' }}

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: worker-bundle
          path: |
            worker/index.js
            worker/wasm_exec.js
            worker/voidslice.wasm
            wrangler.toml
          retention-days: 7

  harnesses:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: make harnesses

  preview-deploy:
    needs: [test, lint, build, harnesses]
    # Same-repo PRs only. Fork PRs don't have access to repo secrets, so
    # Cloudflare deploys can't run from them; the job is intentionally skipped.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build Worker WASM
        run: ./worker/build.sh

      - name: Upload preview Worker version
        id: worker
        # Invoke wrangler directly rather than via cloudflare/wrangler-action@v3:
        # the action wrapper doesn't reliably expose Wrangler stdout via its
        # command-output, and we need to parse "Version Preview Alias URL"
        # out of stdout to feed into the SPA build below.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          output=$(npx -y wrangler@4.86.0 versions upload \
            --preview-alias "pr-${PR_NUMBER}" \
            --message "PR #${PR_NUMBER} (${PR_SHA})" 2>&1)
          echo "$output"
          url=$(echo "$output" | sed -n 's/^Version Preview Alias URL: //p' | head -1)
          if [ -z "$url" ]; then
            echo "::error::Failed to extract Version Preview Alias URL from wrangler output"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview Worker URL: $url"

      - name: Build frontend with preview API URL
        working-directory: web
        run: |
          npm ci || npm install
          npm run build
        env:
          VITE_API_URL: ${{ steps.worker.outputs.url }}

      - name: Deploy Pages preview
        id: pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          npx -y wrangler@4.86.0 pages deploy web/dist \
            --project-name=voidslice \
            --branch="pr-${PR_NUMBER}"
          # Pages mints a deterministic branch-alias URL given (project, branch).
          # Template rather than parse stdout — we own both inputs.
          echo "url=https://pr-${PR_NUMBER}.voidslice.pages.dev" >> "$GITHUB_OUTPUT"

      - name: Post preview URLs to PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: void-slice-preview
          message: |
            ## Preview deploy

            | Surface | URL |
            |---------|-----|
            | Worker  | ${{ steps.worker.outputs.url }} |
            | Pages   | ${{ steps.pages.outputs.url }} |

            Drop a `.decl` / `.entities` / `.entitydef` into the Pages playground to exercise the change end-to-end.

  production-deploy:
    needs: [test, lint, build, harnesses]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build Worker WASM
        run: ./worker/build.sh

      - name: Build frontend
        working-directory: web
        run: |
          npm ci || npm install
          npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Deploy Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web/dist --project-name=voidslice --branch=main

# Required GitHub secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  — scoped to: Workers Scripts:Edit, Pages:Edit
#   CLOUDFLARE_ACCOUNT_ID — Cloudflare account ID
#
# Required GitHub variables (Settings → Secrets and variables → Variables):
#   VITE_API_URL          — production Worker URL embedded in the prod SPA build
#                           (e.g. https://voidslice-api.<acct>.workers.dev).
#                           Preview deploys override this per-PR.

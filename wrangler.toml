name = "voidslice-api"
main = "worker/index.js"
compatibility_date = "2026-04-15"

# CORS allowlist. ALLOWED_ORIGINS is comma-separated exact origins
# (scheme + host). ALLOWED_ORIGIN_SUFFIXES is comma-separated host suffixes,
# each with a leading dot to enforce a label boundary (".voidslice.pages.dev"
# matches "pr-42.voidslice.pages.dev" but not "evilvoidslice.pages.dev").
# A request whose Origin header doesn't match either list is rejected with
# 403 before any work runs — protects the rate-limit budget against
# foreign-origin "simple" POSTs that skip preflight.
[vars]
ALLOWED_ORIGINS = "https://voidslice.pages.dev"
ALLOWED_ORIGIN_SUFFIXES = ".voidslice.pages.dev"

[observability]
enabled = true

# Durable log export. logpush = true opts this script into the
# `workers_trace_events` Logpush dataset; the per-request JSON we write
# at worker/index.js (method, path, status, duration_ms) lands inside
# each event's `Logs` field. The Logpush *job* (destination R2 bucket,
# fields, sample, batch frequency) is configured once in the Cloudflare
# dashboard — wrangler has no [[logpush_job]] block. Current setup:
# bucket `voidslice-worker-logs` (same account, no extra vendor),
# 100% sampling, hourly batches, 30-day R2 lifecycle. Preview versions
# of this script feed the same job — same caveat as the rate-limiter
# binding above; preview traffic is noise-level. Setup steps and the
# retrieval recipe live in worker/LOGS.md.
logpush = true

# Per-deploy version stamp. Mixed into the /lint cache key so a new
# Worker version invalidates prior cached lint responses without waiting
# for TTL expiry.
[version_metadata]
binding = "CF_VERSION_METADATA"

# Per-IP rate limit on /lint. 30 requests / 60 s, keyed on cf-connecting-ip.
# Shared across all versions of the script — preview versions deployed by the
# CI preview-deploy job (M6.2) use the same bucket as production. Acceptable
# at current traffic; revisit if preview load grows.
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

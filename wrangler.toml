name = "voidslice-api"
main = "worker/index.js"
compatibility_date = "2025-09-01"

# Worker plan note: requires Workers Paid ($5/mo) for the 30 s CPU budget.
# See kanban/done/v2/T26-linter-resource-profile.md — Free tier's 10 ms cap
# is not viable for this workload.

# CORS origin in production. Override per environment if the Pages domain changes.
[vars]
ALLOWED_ORIGIN = "*"

[observability]
enabled = true

[env.production]
[env.production.vars]
# Replace with the Cloudflare Pages domain once T12 ties the custom domain in.
ALLOWED_ORIGIN = "*"

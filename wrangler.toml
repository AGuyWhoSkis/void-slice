name = "voidslice-api"
main = "worker/index.js"
compatibility_date = "2025-09-01"

# Worker plan note: requires Workers Paid ($5/mo) for the 30 s CPU budget.
# See kanban/done/v2/T26-linter-resource-profile.md — Free tier's 10 ms cap
# is not viable for this workload.

# CORS origin in production. Override per environment if the Pages domain changes.
[vars]
ALLOWED_ORIGIN = "*"

[observability]
enabled = true

# Per-IP rate limit on /lint. 30 requests / 60 s, keyed on cf-connecting-ip.
# Wrangler does not inherit bindings into named environments, so the same
# block is duplicated under [env.production] below.
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

[env.production]
[env.production.vars]
# Replace with the Cloudflare Pages domain once T12 ties the custom domain in.
ALLOWED_ORIGIN = "*"

[[env.production.unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

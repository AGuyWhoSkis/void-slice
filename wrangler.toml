name = "voidslice-api"
main = "worker/index.js"
compatibility_date = "2025-09-01"

# CORS allowlist. ALLOWED_ORIGINS is comma-separated exact origins
# (scheme + host). ALLOWED_ORIGIN_SUFFIXES is comma-separated host suffixes,
# each with a leading dot to enforce a label boundary (".voidslice.pages.dev"
# matches "pr-42.voidslice.pages.dev" but not "evilvoidslice.pages.dev").
# A request whose Origin header doesn't match either list is rejected with
# 403 before any work runs — protects the rate-limit budget against
# foreign-origin "simple" POSTs that skip preflight.
[vars]
ALLOWED_ORIGINS = "https://voidslice.pages.dev"
ALLOWED_ORIGIN_SUFFIXES = ".voidslice.pages.dev"

[observability]
enabled = true

# Per-IP rate limit on /lint. 30 requests / 60 s, keyed on cf-connecting-ip.
# Shared across all versions of the script — preview versions deployed by the
# CI preview-deploy job (M6.2) use the same bucket as production. Acceptable
# at current traffic; revisit if preview load grows.
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

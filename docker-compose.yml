services:
  server:
    build: .
    ports:
      - "8080:8080"
    command: ["serve", "--port", "8080"]
    environment:
      ALLOWED_ORIGIN: "http://localhost:5173"

  web:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./web:/app
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: "http://localhost:8080"
    command: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0 --port 5173"]
    depends_on:
      - server
